[project]
name = "coldtrace"
version = "0.1.0"
description = "AI copilot for cold-chain logistics dispatchers"
authors = [{ name = "Prathamesh Mishra", email = "mprathamesh2023@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.12",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "api", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
