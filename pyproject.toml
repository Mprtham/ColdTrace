[project]
name = "coldtrace"
version = "0.1.0"
description = "AI copilot for cold-chain logistics dispatchers"
authors = [{ name = "Prathamesh Mishra", email = "mprathamesh2023@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.4",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.12",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "api", "scripts", "tests", "ui"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installed editable by `uv sync`, so every entry point (streamlit, uvicorn, scripts)
# imports these the same way, whatever its working directory or script path.
packages = ["src", "api", "ui", "scripts"]
