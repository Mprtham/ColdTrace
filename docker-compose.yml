# Local stack: Postgres + Qdrant. Not required for development
# (Neon + Qdrant local mode are the defaults); used before deploy.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coldtrace
      POSTGRES_PASSWORD: coldtrace
      POSTGRES_DB: coldtrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldtrace"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
